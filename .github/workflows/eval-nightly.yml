name: Eval Nightly (Open RAGBench v2)

# 01:00 北京时间：DGX 空闲窗，对已部署实例（本机回环 8791）跑 487 题全量，
# 与钉住的基线做逐题对比门禁，结果推企微。评测异常自动补判/重跑（--auto-retry）。
# 选 01:00 而非 03:00：全量含补判最坏近 4h，03:00 起跑会撞到早高峰（实测评测期
# TTFT 明显受影响）。跑完 5h 仍在 06:00 前收工。
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: [self-hosted]
    timeout-minutes: 420
    env:
      AICHAT: http://127.0.0.1:8791
      OUT_DIR: evals-nightly
      SITE_URL: https://angineer.cn/admin/evals?view=nightly
      NIGHTLY_DATA: /home/runner/AnGIneer/data/evals/nightly
    steps:
      - uses: actions/checkout@v4

      - name: Deps & health
        run: |
          python3 -c "import requests" 2>/dev/null || python3 -m pip install --quiet requests
          curl -sf --max-time 5 "$AICHAT/health" > /dev/null
          echo "服务在线，开始 nightly"

      - name: Import datasets (idempotent)
        run: |
          for f in open-ragbench-subset-v2 open-ragbench-refusal-v2 open-ragbench-smoke-v1; do
            curl -sf -X POST "$AICHAT/api/evals/datasets/import" \
              -F "file=@data/evals/datasets/$f.json" > /dev/null || { echo "导入失败: $f"; exit 1; }
          done
          echo "题集就绪"

      - name: Full eval + auto retry
        id: eval
        run: |
          mkdir -p "$OUT_DIR"
          python3 scripts/open_ragbench/run_eval.py \
            --dataset-file data/evals/datasets/open-ragbench-subset-v2.json \
            --dataset-id open-ragbench-subset-v2 \
            --out "$OUT_DIR/raw.json" --auto-retry --poll-timeout 21600

      - name: Report
        id: report
        run: |
          python3 scripts/open_ragbench/report.py \
            --raw "$OUT_DIR/raw.json" \
            --manifest data/open_ragbench/subset/subset_manifest_v2.json \
            --out "$OUT_DIR/report.md"

      - name: Regression gate vs pinned baseline
        id: gate
        continue-on-error: true
        run: |
          python3 scripts/open_ragbench/compare_runs.py compare \
            --base baseline --new "$OUT_DIR/raw.json" --out "$OUT_DIR/gate.md"

      - name: Publish nightly artifacts (site 夜间维护)
        if: always()
        run: |
          python3 scripts/open_ragbench/publish_nightly.py \
            --artifacts "$OUT_DIR" \
            --target "$NIGHTLY_DATA" \
            --dataset-id open-ragbench-subset-v2 \
            --dataset-file data/evals/datasets/open-ragbench-subset-v2.json \
            --error-note "eval=${{ steps.eval.conclusion }} report=${{ steps.report.conclusion }} gate=${{ steps.gate.conclusion }}"

      - name: Notify WeCom (always)
        if: always()
        env:
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/open_ragbench/notify.py \
            --raw "$OUT_DIR/raw.json" --gate "$OUT_DIR/gate.json" \
            --gate-state "${{ steps.gate.conclusion }}" \
            --error-note "eval=${{ steps.eval.conclusion }} report=${{ steps.report.conclusion }} gate=${{ steps.gate.conclusion }}" \
            --site-url "$SITE_URL" \
            --run-url "$RUN_URL"

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-nightly-${{ github.run_number }}
          path: evals-nightly/
          retention-days: 30

      - name: Fail on red gate
        if: steps.gate.outcome == 'failure'
        run: exit 1
