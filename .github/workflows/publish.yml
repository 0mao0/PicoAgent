name: Publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      desc:
        description: "发布说明（不填自动读 CHANGELOG）"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install
      - run: pnpm typecheck
      - run: npm publish --provenance
      - name: Notify WeCom group
        if: success()
        env:
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
          PACKAGE: ${{ github.repository }}
          INTRO: 通用表格组件
          TAG: ${{ github.ref_name }}
          DESC: ${{ inputs.desc || '' }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHANNELS: GitHub + npm registry
        run: python3 .github/scripts/release_notify.py
